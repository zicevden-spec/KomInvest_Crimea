name: AutoPost KomInvest

on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      post_type:
        description: "Тип поста (longread / short)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - longread
          - short

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_URL: ${{ secrets.CHANNEL_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FORCE_POST_TYPE: ${{ github.event.inputs.post_type }}
      - name: Commit photo history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add photo_history.json
          git diff --staged --quiet || git commit -m "chore: update photo history [skip ci]"
          git push